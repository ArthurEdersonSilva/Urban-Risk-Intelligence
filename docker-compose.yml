
services:
  postgres:
    image: postgres:16
    container_name: urbanrisk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: urbanrisk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - urbanrisk_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urbanrisk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  urbanrisk_data:
